name: Daily Quant Data Update

on:
  schedule:
    # 定时任务：每天北京时间下午 16:30 (即UTC时间 08:30) 运行，周一到周五
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 允许手动点击运行按钮，方便随时测试

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许机器人把算好的数据存回仓库

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Quant Script
      run: |
        python get_real_data.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json
        git commit -m "Auto-update quant data" || echo "今天的数据已经是最新的啦，无需提交"
        git push
