name: Daily Quant Data Update

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      # 添加了更长超时的安装策略
      run: |
        pip install --upgrade pip
        pip install akshare pandas numpy --default-timeout=100

    - name: Run Quant Script
      # 如果脚本运行报错，这里会直接标红停止，不会强行走到下一步
      run: |
        python get_real_data.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        # 增加判断：只有文件真的存在时才提交
        if [ -f data.json ]; then
          git add data.json
          git commit -m "Auto-update quant data" || echo "今天的数据已经是最新的啦，无需提交"
          git push
        else
          echo "⚠️ 错误：未找到 data.json，数据抓取可能失败了。"
          exit 1
        fi
